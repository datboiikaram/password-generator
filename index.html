<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <script
      src="https://kit.fontawesome.com/b698c16b75.js"
      crossorigin="anonymous"
    ></script>
    <title>Password Generator</title>
  </head>
  <body>
    <div class="container">
      <fieldset class="fieldset">
        <legend class="legend">Password</legend>
        <input class="input" type="text" placeholder="type your password ..." />
        <i class="fa-solid fa-copy copyButton" title="copy password"></i>
      </fieldset>
      <button class="generateButton">generate password</button>
      <div class="validate">
        <div class="validate__item validate__lenght">
          <i class="fa-solid fa-circle-xmark" data-name="validationIcon"></i>
          Length must be 10 charachters.
        </div>
        <div class="validate__item validate__upperCase">
          <i class="fa-solid fa-circle-xmark" data-name="validationIcon"></i>
          Must contain UpperCase letter.
        </div>
        <div class="validate__item validate__lowerCase">
          <i class="fa-solid fa-circle-xmark" data-name="validationIcon"></i>
          Must contain LowerCase letter.
        </div>
        <div class="validate__item validate__number">
          <i class="fa-solid fa-circle-xmark" data-name="validationIcon"></i>
          Must contain Number.
        </div>
        <div class="validate__item validate__special">
          <i class="fa-solid fa-circle-xmark" data-name="validationIcon"></i>
          Must contain Special Character.
        </div>
      </div>
      <div class="toastArea"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
